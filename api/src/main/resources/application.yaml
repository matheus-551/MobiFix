spring:
  hateoas:
    use-hal-as-default-json-media-type: false
  application:
    name: mobifix-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mobifix}
    username: ${DB_USERNAME:mobifix}
    password: ${DB_PASSWORD:mobfix_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081}
